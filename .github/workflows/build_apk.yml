name: 自动编译 Gemini 原生增强 Xposed APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      custom_tag:
        description: '可选：自定义 Tag (留空则自动按构建次数递增)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle 运行环境
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 自动计算并生成递增版本号
        id: version
        run: |
          RUN_NUM=${{ github.run_number }}
          # 从 1.00 开始计算版本号，之后逐步递增
          OFFSET=$((RUN_NUM > 0 ? RUN_NUM - 1 : 0))
          V_NAME=$(printf "1.%02d" $OFFSET)
          V_CODE=$((1000 + RUN_NUM))
          
          INPUT_TAG="${{ github.event.inputs.custom_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${V_NAME}"
          fi
          
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          
          echo "===================================="
          echo " 自动生成版本名称: $V_NAME"
          echo " 自动生成版本代号: $V_CODE"
          echo " 最终发布 Tag:     $TAG"
          echo "===================================="

      - name: 自动准备工程文件与依赖
        run: |
          echo "==== 1. 检查并准备工程目录 ===="
          if [ -d "android-voyager-enhancer" ]; then
            echo "检测到 android-voyager-enhancer 源码目录，同步至根构建目录..."
            cp -rf android-voyager-enhancer/* .
          fi

          mkdir -p app/libs
          if [ ! -f "app/libs/xposed-api-82.jar" ]; then
            echo "正在下载 xposed-api 依赖..."
            curl -sLo app/libs/xposed-api-82.jar https://api.xposed.info/de/robv/android/xposed/api/82/api-82.jar || true
          fi

          if [ ! -f "app/voyager-release.jks" ]; then
            find . -name "voyager-release.jks" -exec cp {} app/voyager-release.jks \; 2>/dev/null || true
          fi

          if [ -f "./gradlew" ]; then
            sed -i 's/\r$//' ./gradlew || true
            chmod +x ./gradlew || true
          fi

      - name: 编译 Debug 版 APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          echo "==== 2. 开始 Gradle 构建 ===="
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace --info
          else
            gradle assembleDebug --no-daemon --stacktrace --info
          fi

      - name: 提取扁平化 APK (零文件夹嵌套)
        run: |
          echo "==== 3. 提取编译产物 ===="
          mkdir -p single_apk
          find . -name "*debug*.apk" -exec cp {} single_apk/Voyager-Gemini-Enhancer.apk \;
          if [ ! -f "single_apk/Voyager-Gemini-Enhancer.apk" ]; then
            echo "警告：未找到 debug apk，尝试搜索所有 apk..."
            find . -name "*.apk" -exec cp {} single_apk/Voyager-Gemini-Enhancer.apk \;
          fi
          ls -lh single_apk/

      - name: 备份上传至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Voyager-Gemini-Enhancer-APK
          path: single_apk/Voyager-Gemini-Enhancer.apk
          retention-days: 14

      - name: 获取最近一次 Commit 信息
        id: commit_info
        run: |
          # 获取最近一条 commit 的标题和内容
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          echo "msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: 自动发布到 GitHub Releases (自动同步 Commit)
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Voyager for Gemini ${{ steps.version.outputs.version_name }}"
          make_latest: true
          body: |
            ${{ steps.commit_info.outputs.msg }}
          files: single_apk/Voyager-Gemini-Enhancer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
