name: 自动编译 Gemini 原生增强 Xposed APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle 运行环境 (全局安装 Gradle 8.5)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 自动修复目录层级与可执行权限
        run: |
          echo "=== 正在检查目录文件 ==="
          ls -la
          # 如果拖拽上传时多了一层子文件夹，自动将子文件夹内容提取到根目录
          if [ ! -f "build.gradle" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "build.gradle" -not -path "*/app/*" | head -n 1 | xargs dirname 2>/dev/null || true)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "检测到工程在子目录 $SUBDIR，自动移至根目录"
              cp -rf "$SUBDIR"/* . || true
            fi
          fi
          # 修复 Windows CRLF 换行符
          if [ -f "./gradlew" ]; then
            sed -i 's/\r$//' ./gradlew || true
            chmod +x ./gradlew || true
          fi

      - name: 编译 Debug 版 APK (自动兼容 gradlew 与全局 gradle)
        run: |
          if [ -f "./gradlew" ]; then
            echo "正在使用 gradlew 编译..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "未检测到 gradlew，正在使用 setup-gradle 提供的系统 gradle 编译..."
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 上传 APK 安装包至 GitHub 产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Voyager-Enhancer-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 7
