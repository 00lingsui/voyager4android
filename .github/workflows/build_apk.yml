name: 自动编译 Gemini 原生增强 Xposed APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle 运行环境
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 接受 Android SDK 协议
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 自动修复工程文件与依赖
        run: |
          if [ ! -f "build.gradle" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "build.gradle" -not -path "*/app/*" | head -n 1 | xargs dirname 2>/dev/null || true)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "检测到工程在子目录 $SUBDIR，移至根目录..."
              cp -rf "$SUBDIR"/* . || true
            fi
          fi

          mkdir -p app/libs
          if [ ! -f "app/libs/xposed-api-82.jar" ]; then
            echo "正在下载 xposed-api 依赖..."
            curl -sLo app/libs/xposed-api-82.jar https://api.xposed.info/de/robv/android/xposed/api/82/api-82.jar || true
          fi

          if ! grep -q "fileTree" app/build.gradle 2>/dev/null; then
            sed -i "s/dependencies {/dependencies {\n    compileOnly fileTree(dir: 'libs', include: ['*.jar'])/" app/build.gradle || true
          fi

          if ! grep -q "api.xposed.info" settings.gradle 2>/dev/null; then
            sed -i "s|mavenCentral()|mavenCentral()\n        maven { url 'https://api.xposed.info/' }|g" settings.gradle || true
          fi

          find . -name "VoyagerOverlayView.java" -exec sed -i 's/sp.getString("folders",.*/sp.getString("folders", "[]");/' {} + 2>/dev/null || true
          find . -name "VoyagerOverlayView.java" -exec sed -i 's/sp.getString("prompts",.*/sp.getString("prompts", "[]");/' {} + 2>/dev/null || true

          # 确保全局唯一的固定签名密钥存在，保持 APK 签名永不改变（支持无缝覆盖更新，无需卸载旧版本）
          if [ ! -f "app/voyager-release.jks" ]; then
            find . -name "voyager-release.jks" -exec cp {} app/voyager-release.jks \; 2>/dev/null || true
          fi

          if [ -f "./gradlew" ]; then
            sed -i 's/\r$//' ./gradlew || true
            chmod +x ./gradlew || true
          fi

      - name: 编译 Debug 版 APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 提取扁平化 APK (零文件夹嵌套)
        run: |
          mkdir -p single_apk
          find . -name "*debug*.apk" -exec cp {} single_apk/Voyager-Gemini-Enhancer.apk \;
          ls -lh single_apk/

      - name: 备份上传至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Voyager-Gemini-Enhancer-APK
          path: single_apk/Voyager-Gemini-Enhancer.apk
          retention-days: 7

      - name: 自动发布到 GitHub Releases (免解压直链 APK)
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.00"
          name: "Voyager for Gemini 1.00"
          body: |
            - 🔘 **圆形发光悬浮球**：升级为 52dp 翡翠绿圆形发光悬浮球，支持全屏自由拖拽、松手平滑自动贴边吸附、闲置自动半透明淡化。
            - 🔖 **会话书签与极速直达**：新增星标会话书签功能，一键收藏重点对话；点击书签卡片即刻直达相对应对话记录与完整问答详情页面。
            - 📂 **三级分类文件夹**：精准捕获并收录当前会话，支持树状文件夹归类管理与点击回溯问答记录。
            - 📍 **对话时间线导航**：自动提炼聊天提问节点为可视化小地图，点击平滑滚动并高亮定位当前对话。
            - 💾 **多格式数据导出**：一键导出包含标准代码高亮渲染的 Markdown / JSON 格式文本，自动唤起系统级分享。
            - 💡 **提示词库与变量模版**：内置 Prompt 词库，支持 `{{变量}}` 占位符一键填入输入框并聚焦。
            - 📐 **数学公式多平台复制**：支持一键提取公式并转换为 LaTeX、MathML (专为 Word 优化) 及 Notion 兼容格式。
            - 🔑 **永久固定签名**：内置统一 Release 签名配置，后续版本覆盖更新无需重复卸载安装。
          files: single_apk/Voyager-Gemini-Enhancer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
