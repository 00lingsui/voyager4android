name: 自动编译 Gemini 原生增强 Xposed APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      custom_tag:
        description: '可选：自定义 Tag (留空则自动按构建次数递增)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle 运行环境
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 自动计算并生成递增版本号
        id: version
        run: |
          BASE_VERSION="1.0"
          RUN_NUM=${{ github.run_number }}
          
          V_CODE=$((1000 + RUN_NUM))
          V_NAME="${BASE_VERSION}.${RUN_NUM}"
          
          INPUT_TAG="${{ github.event.inputs.custom_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${V_NAME}"
          fi
          
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          
          echo "===================================="
          echo " 自动生成版本名称: $V_NAME"
          echo " 自动生成版本代号: $V_CODE"
          echo " 最终发布 Tag:     $TAG"
          echo "===================================="

      - name: 自动准备工程文件与依赖
        run: |
          echo "==== 1. 检查并准备工程目录 ===="
          if [ -d "android-voyager-enhancer" ]; then
            echo "检测到 android-voyager-enhancer 源码目录，同步至根构建目录..."
            cp -rf android-voyager-enhancer/* .
          fi

          mkdir -p app/libs
          if [ ! -f "app/libs/xposed-api-82.jar" ]; then
            echo "正在下载 xposed-api 依赖..."
            curl -sLo app/libs/xposed-api-82.jar https://api.xposed.info/de/robv/android/xposed/api/82/api-82.jar || true
          fi

          if [ ! -f "app/voyager-release.jks" ]; then
            find . -name "voyager-release.jks" -exec cp {} app/voyager-release.jks \; 2>/dev/null || true
          fi

          if [ -f "./gradlew" ]; then
            sed -i 's/\r$//' ./gradlew || true
            chmod +x ./gradlew || true
          fi

      - name: 编译 Debug 版 APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          echo "==== 2. 开始 Gradle 构建 ===="
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace --info
          else
            gradle assembleDebug --no-daemon --stacktrace --info
          fi

      - name: 提取扁平化 APK (零文件夹嵌套)
        run: |
          echo "==== 3. 提取编译产物 ===="
          mkdir -p single_apk
          find . -name "*debug*.apk" -exec cp {} single_apk/Voyager-Gemini-Enhancer.apk \;
          if [ ! -f "single_apk/Voyager-Gemini-Enhancer.apk" ]; then
            echo "警告：未找到 debug apk，尝试搜索所有 apk..."
            find . -name "*.apk" -exec cp {} single_apk/Voyager-Gemini-Enhancer.apk \;
          fi
          ls -lh single_apk/

      - name: 备份上传至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Voyager-Gemini-Enhancer-APK
          path: single_apk/Voyager-Gemini-Enhancer.apk
          retention-days: 14

      - name: 自动发布到 GitHub Releases (免解压直链 APK)
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Voyager for Gemini ${{ steps.version.outputs.version_name }}"
          make_latest: true
          body: |
            - 🚀 **自动构建版本**：`v${{ steps.version.outputs.version_name }}` (Build: `${{ steps.version.outputs.version_code }}`)
            - 🪐 **Gemini 额度与刷新时间监控 UI (StatusBar Capsule)**：胶囊型/圆角扁平顶部悬浮条，双进度条实时显示短期与每周额度用量、绿色指示点、动态精确倒计时；右侧集成 ↻ 手动刷新与 🗗 详情弹窗。
            - 🪟 **FloatingQuotaView (WindowManager 架构)**：基于独立 WindowManager 浮动层渲染，支持全屏自由平滑触控拖拽与安全生命周期回收。
            - 🔘 **圆形发光悬浮球**：升级为 52dp 翡翠绿圆形发光悬浮球，支持全屏自由拖拽、松手平滑自动贴边吸附、闲置自动半透明淡化。
            - 🔖 **会话书签与极速直达**：新增星标会话书签功能，一键收藏重点对话；点击书签卡片即刻直达相对应对话记录与完整问答详情页面。
            - 📂 **三级分类文件夹**：精准捕获并收录当前会话，支持树状文件夹归类管理与点击回溯问答记录。
            - 📍 **对话时间线导航**：自动提炼聊天提问节点为可视化小地图，点击平滑滚动并高亮定位当前对话。
            - 💾 **多格式数据导出**：一键导出包含标准代码高亮渲染的 Markdown / JSON 格式文本，自动唤起系统级分享。
            - 💡 **提示词库与变量模版**：内置 Prompt 词库，支持 `{{变量}}` 占位符一键填入输入框并聚焦。
            - 📐 **数学公式多平台复制**：支持一键提取公式并转换为 LaTeX、MathML (专为 Word 优化) 及 Notion 兼容格式。
            - 🔑 **永久固定签名**：内置统一 Release 签名配置，后续版本覆盖更新无需重复卸载安装。
          files: single_apk/Voyager-Gemini-Enhancer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
